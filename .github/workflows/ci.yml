name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Restore
        run: dotnet restore *.slnx

      - name: Build
        run: dotnet build *.slnx -c Release --no-restore

      - name: Test
        run: dotnet test *.slnx -c Release --no-build

      - name: API surface diff
        run: bash scripts/api-diff.sh

      - name: Verify no Unity.Mathematics DLL leak
        run: |
          if git ls-files | grep -qiE 'Unity\.Mathematics.*\.dll$'; then
            echo "FAIL: Unity.Mathematics DLL committed!"
            git ls-files | grep -iE 'Unity\.Mathematics.*\.dll$'
            exit 1
          fi
          LEAKS=$(find . -path '*/bin' -prune -o -path '*/obj' -prune -o -path './.git' -prune \
            -o -name 'Unity.Mathematics*.dll' -print 2>/dev/null)
          if [ -n "$LEAKS" ]; then
            echo "FAIL: Unity.Mathematics DLL in package!"
            echo "$LEAKS"
            exit 1
          fi
          echo "OK: No Unity.Mathematics DLL leak."

      - name: Verify no unreplaced placeholders
        run: |
          if ls __PACKAGE__/Runtime/__PLACEHOLDER__.cs 2>/dev/null | grep -q .; then
            echo "SKIP: Template repo — placeholders are intentional."
            exit 0
          fi
          LEFTOVER=$(grep -rl '__[A-Z_]*__' \
            --include='*.cs' --include='*.json' --include='*.asmdef' . 2>/dev/null \
            | grep -v '/obj/' | grep -v '/bin/' || true)
          if [ -n "$LEFTOVER" ]; then
            echo "FAIL: Unreplaced template placeholders:"
            echo "$LEFTOVER"
            exit 1
          fi
          echo "OK: No unreplaced placeholders."

      - name: Validate UPM structure
        run: bash scripts/validate-upm.sh

      - name: Verify metadata integrity
        run: bash scripts/verify-meta.sh

      - name: Check package size
        run: bash scripts/check-size.sh 500

      - name: Audit dependencies
        run: bash scripts/audit-deps.sh
        continue-on-error: true

      - name: Template self-test
        run: if [ -f scripts/test-template.sh ]; then bash scripts/test-template.sh; else echo "Skipped (not a template)"; fi
