name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Verify version matches tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PKG=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "FAIL: tag v$TAG ≠ package.json version $PKG"
            exit 1
          fi
          echo "OK: v$TAG matches package.json"

      - name: Build & test
        run: |
          dotnet restore *.slnx
          dotnet build *.slnx -c Release --no-restore
          dotnet test *.slnx -c Release --no-build

      - name: Validate package
        run: bash scripts/validate-upm.sh

      - name: Run benchmarks
        run: bash scripts/bench.sh "*"

      - name: Check for regressions
        run: bash scripts/bench-compare.sh

      - name: Audit dependencies (release gate)
        run: bash scripts/audit-deps.sh

      - name: Check package size
        run: bash scripts/check-size.sh 500

      - name: Generate AI context
        run: bash scripts/generate-ai-context.sh artifacts/ai/codebase.md

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release artifacts
        run: |
          mkdir -p artifacts/release

          # Package zip (full repo)
          git archive --format=zip --prefix=$GITHUB_REPOSITORY_NAME/ HEAD \
            -o artifacts/release/package.zip

          # AI context
          bash scripts/generate-ai-context.sh artifacts/ai/codebase.md 2>/dev/null || true

          # Test summary
          echo "# Release $GITHUB_REF_NAME" > artifacts/release/test-summary.md
          echo "" >> artifacts/release/test-summary.md
          echo "- dotnet build: ✓" >> artifacts/release/test-summary.md
          echo "- dotnet test: ✓" >> artifacts/release/test-summary.md
          echo "- UPM validation: ✓" >> artifacts/release/test-summary.md
          echo "- Package size: ✓" >> artifacts/release/test-summary.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/package.zip
            artifacts/release/test-summary.md
            artifacts/ai/codebase.md
            artifacts/ai/codebase.compact.md
          generate_release_notes: true

      - name: OpenUPM indexer reminder
        run: |
          PKG=$(python3 -c "import json; print(json.load(open('package.json'))['name'])")
          VER=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          echo "OpenUPM will index this release automatically if registered."
          echo "Check: https://openupm.com/packages/${PKG}/"
          echo "Register once: bash scripts/publish-openupm.sh"
