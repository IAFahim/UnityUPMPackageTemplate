name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Verify version matches tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PKG=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "FAIL: tag v$TAG ≠ package.json version $PKG"
            exit 1
          fi
          echo "OK: v$TAG matches package.json"

      - name: Build & test
        run: |
          dotnet restore *.slnx
          dotnet build *.slnx -c Release --no-restore
          dotnet test *.slnx -c Release --no-build

      - name: Validate package
        run: bash scripts/validate-upm.sh

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release archive
        run: |
          mkdir -p artifacts
          git archive --format=zip --prefix=$GITHUB_REPOSITORY_NAME/ HEAD \
            -o artifacts/package.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/package.zip
          generate_release_notes: true
