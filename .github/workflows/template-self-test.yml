name: template-self-test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Run template self-test
        run: bash scripts/test-template.sh

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-artifacts
          path: /tmp/unity-template-selftest-*/
